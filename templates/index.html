<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA FFX - Free AI Bot Deployer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0a0a0f; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .container { background: #14141e; padding: 40px 35px; border-radius: 24px; width: 100%; max-width: 480px; border: 1px solid #2a2a3a; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #00f0ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area p { color: #6a6a7a; font-size: 14px; margin-top: 5px; letter-spacing: 1px; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #1e1e2a; padding: 12px 18px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #2b2b3b; }
        .user-bar .greeting { font-size: 14px; color: #c0c0d0; }
        .auth-buttons button { background: transparent; border: 1px solid #3a3a4e; color: #c0c0d0; padding: 6px 16px; border-radius: 30px; cursor: pointer; transition: 0.3s; margin-left: 5px; }
        .auth-buttons button:hover { background: #00f0ff; color: #000; border-color: #00f0ff; }
        .auth-buttons .signup { background: #7b2ffc; border-color: #7b2ffc; color: #fff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; text-transform: uppercase; color: #8888aa; margin-bottom: 6px; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 14px 18px; background: #1a1a26; border: 1px solid #2c2c40; border-radius: 14px; color: #fff; font-size: 15px; transition: 0.3s; outline: none; }
        .form-group input:focus { border-color: #7b2ffc; box-shadow: 0 0 20px rgba(123, 47, 252, 0.15); }
        .form-group input::placeholder { color: #4a4a5e; }
        .deploy-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #7b2ffc, #00f0ff); border: none; border-radius: 16px; font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .deploy-btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3); }
        .deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; background: #3a3a4e; }
        .status-msg { text-align: center; margin-top: 15px; font-size: 14px; color: #7bff9a; min-height: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 999; }
        .modal-box { background: #1a1a28; padding: 35px; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid #333; }
        .modal-box h2 { margin-bottom: 20px; color: #fff; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid #333; border-radius: 12px; color: #fff; }
        .modal-box .close { float: right; background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .modal-box button[type="submit"] { width: 100%; padding: 12px; background: #00f0ff; border: none; border-radius: 12px; font-weight: bold; color: #000; cursor: pointer; }
        .switch-link { color: #7b2ffc; cursor: pointer; text-align: center; display: block; margin-top: 10px; }
        .footnote { margin-top: 20px; text-align: center; font-size: 11px; color: #3a3a4e; }
        .footnote a { color: #5a5a7e; text-decoration: none; }
        .badge { background: #2a2a3e; padding: 2px 12px; border-radius: 20px; font-size: 11px; color: #aaa; }
        .free-tag { background: #00f0ff20; color: #00f0ff; padding: 2px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #00f0ff40; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <h1><i class="fas fa-robot" style="color: #00f0ff; -webkit-text-fill-color: initial;"></i> AURA FFX</h1>
            <p>Deploy your Telegram AI Bot <span class="free-tag">💎 ১০০% ফ্রি</span></p>
        </div>
        <div class="user-bar" id="userBar">
            <span class="greeting" id="userDisplay"><i class="fas fa-user-circle"></i> অতিথি</span>
            <div class="auth-buttons" id="authButtons">
                <button onclick="openModal('login')">লগইন</button>
                <button onclick="openModal('register')" class="signup">রেজিস্টার</button>
            </div>
        </div>
        <form id="deployForm" onsubmit="handleDeploy(event)">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> বটের নাম (NAME)</label>
                <input type="text" id="botName" placeholder="যেমন: My AI Bot" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-at"></i> ইউজারনেম (USERNAME)</label>
                <input type="text" id="botUsername" placeholder="যেমন: MyAIBot" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-key"></i> টেলিগ্রাম বট API কী</label>
                <input type="text" id="telegramKey" placeholder="786xxxxxx:AAHxxxxx" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-brain"></i> গুগল জেমিনি API কী</label>
                <input type="text" id="geminiKey" placeholder="AIzaSyCxxxxxxxxxxx" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-cloud-upload-alt"></i> রেন্ডার API কী</label>
                <input type="text" id="renderKey" placeholder="rnd_xxxxxxxxxxxx" required>
            </div>
            <button type="submit" class="deploy-btn" id="deployBtn">
                <i class="fas fa-rocket"></i> ফ্রি ডিপ্লয় করুন
            </button>
            <div id="statusMsg" class="status-msg"></div>
        </form>
        <div class="footnote">
            <span class="badge">v1.0</span> 
            <i class="fas fa-shield-alt"></i> সম্পূর্ণ ফ্রি • <a href="#">সাপোর্ট</a>
        </div>
    </div>

    <!-- মডাল -->
    <div id="registerModal" class="modal">
        <div class="modal-box">
            <button class="close" onclick="closeModal('registerModal')">&times;</button>
            <h2><i class="fas fa-user-plus"></i> রেজিস্টার</h2>
            <form onsubmit="handleRegister(event)">
                <input type="text" id="regUsername" placeholder="ইউজারনেম" required>
                <input type="password" id="regPassword" placeholder="পাসওয়ার্ড" required>
                <button type="submit">অ্যাকাউন্ট তৈরি করুন</button>
            </form>
            <div class="switch-link" onclick="closeModal('registerModal'); openModal('login')">ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন</div>
        </div>
    </div>
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <button class="close" onclick="closeModal('loginModal')">&times;</button>
            <h2><i class="fas fa-sign-in-alt"></i> লগইন</h2>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="loginUsername" placeholder="ইউজারনেম" required>
                <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" required>
                <button type="submit">লগইন করুন</button>
            </form>
            <div class="switch-link" onclick="closeModal('loginModal'); openModal('register')">অ্যাকাউন্ট নেই? রেজিস্টার করুন</div>
        </div>
    </div>

    <script>
        function openModal(type) {
            if(type === 'register') document.getElementById('registerModal').style.display = 'flex';
            else if(type === 'login') document.getElementById('loginModal').style.display = 'flex';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
        function updateUI(user) {
            const display = document.getElementById('userDisplay');
            const authBtns = document.getElementById('authButtons');
            const deployBtn = document.getElementById('deployBtn');
            if(user) {
                display.innerHTML = `<i class="fas fa-user-circle"></i> স্বাগতম, ${user}`;
                authBtns.innerHTML = `<button onclick="logout()"><i class="fas fa-sign-out-alt"></i> লগআউট</button>`;
                deployBtn.disabled = false;
                deployBtn.innerHTML = `<i class="fas fa-rocket"></i> ফ্রি ডিপ্লয় করুন`;
            } else {
                display.innerHTML = `<i class="fas fa-user-circle"></i> অতিথি`;
                authBtns.innerHTML = `<button onclick="openModal('login')">লগইন</button><button onclick="openModal('register')" class="signup">রেজিস্টার</button>`;
                deployBtn.disabled = true;
                deployBtn.innerHTML = `<i class="fas fa-lock"></i> ডিপ্লয় করতে লগইন করুন`;
            }
        }
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if(data.success) { alert(data.msg); closeModal('registerModal'); openModal('login'); } 
            else { alert(data.msg); }
        }
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if(data.success) { closeModal('loginModal'); window.location.reload(); } 
            else { alert(data.msg); }
        }
        async function logout() { await fetch('/logout'); window.location.reload(); }
        async function handleDeploy(e) {
            e.preventDefault();
            const name = document.getElementById('botName').value;
            const username = document.getElementById('botUsername').value;
            const telKey = document.getElementById('telegramKey').value;
            const gemKey = document.getElementById('geminiKey').value;
            const renKey = document.getElementById('renderKey').value;
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ডিপ্লয় হচ্ছে...';
            const res = await fetch('/deploy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, username, telegram_key: telKey, gemini_key: gemKey, render_key: renKey})
            });
            const data = await res.json();
            if(data.success) { statusMsg.innerHTML = '✅ ' + data.msg; } 
            else { statusMsg.innerHTML = '❌ ' + data.msg; }
        }
        window.onload = function() {
            {% if logged_in %} updateUI("{{ user[1] }}"); {% else %} updateUI(null); {% endif %}
        }
    </script>
</body>
</html>
